name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # 五秒鐘就跑得完，抓的是「不必等編譯器也看得出來」的錯：
      # 未閉合的巢狀區塊註解、括號不平衡、跨套件漏掉的 import。
      # 放在最前面是因為 Gradle 光是下載就要一分半。
      - name: Kotlin sanity check
        run: python3 tools/ktcheck.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 模擬層完全沒有相依 Android API，所以規則、尋路、地圖與劇本
      # 都能在一般的 JVM 上用正式的 assets 驗過一遍。
      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # lint 目前不擋建置，但報告要撈出來看 —— 它抓的是編譯器不管的東西
      # （未使用的資源、無障礙、API 版本誤用），對一個要上 F-Droid 的專案有價值。
      # 違規內容會直接印在這一步的 log 裡（見 app/build.gradle.kts 的 lint 區塊），
      # HTML／XML 仍然留成 artifact 給需要點來點去的時候用。
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      # 沒有這一步，每台全新的 runner 都會自己產生一把 debug keystore，
      # 每次產出的 debug APK 簽名都不一樣，裝在手機上的版本永遠無法覆蓋更新。
      # 固定的那一把以 base64 存在 repo secret DEBUG_KEYSTORE，還原到 Android
      # 建置工具預設讀取的位置，Gradle 設定不必動。這把只簽 debug 版；
      # F-Droid 的 release 由 F-Droid 自己簽。來自 fork 的 PR 拿不到 secret，
      # 會退回隨機金鑰並留一則警告，不讓建置失敗。
      - name: Restore the shared debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE secret 沒有設定，debug APK 會用隨機金鑰簽名，無法覆蓋更新。"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: mapconquer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # F-Droid 建的是 release variant，這裡也走一遍同一條路徑。
      # 專案沒有簽章設定，所以產出的是未簽章的 APK。
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: mapconquer-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # 地圖與翻譯都是產生出來的，重跑產生器之後不該有任何差異 ——
  # 否則代表有人手動改了 assets，下一次重新產生就會被蓋掉。
  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate maps, scenarios and strings
        run: |
          python3 tools/genworld.py
          python3 tools/genstrings.py

      - name: Fail if the committed output is stale
        run: |
          if ! git diff --exit-code -- app/src/main/assets app/src/main/res; then
            echo
            echo "產生出來的檔案與 commit 的版本不一致。"
            echo "請在本機執行 python3 tools/genworld.py && python3 tools/genstrings.py 之後一起 commit。"
            exit 1
          fi
