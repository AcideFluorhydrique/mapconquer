name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 模擬層完全沒有相依 Android API，所以規則、尋路、地圖與劇本
      # 都能在一般的 JVM 上用正式的 assets 驗過一遍。
      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: mapconquer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # F-Droid 建的是 release variant，這裡也走一遍同一條路徑。
      # 專案沒有簽章設定，所以產出的是未簽章的 APK。
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: mapconquer-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # 地圖與翻譯都是產生出來的，重跑產生器之後不該有任何差異 ——
  # 否則代表有人手動改了 assets，下一次重新產生就會被蓋掉。
  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate maps, scenarios and strings
        run: |
          python3 tools/genworld.py
          python3 tools/genstrings.py

      - name: Fail if the committed output is stale
        run: |
          if ! git diff --exit-code -- app/src/main/assets app/src/main/res; then
            echo
            echo "產生出來的檔案與 commit 的版本不一致。"
            echo "請在本機執行 python3 tools/genworld.py && python3 tools/genstrings.py 之後一起 commit。"
            exit 1
          fi
